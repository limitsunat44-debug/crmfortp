name: Sync doctor sales

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
      end:
        description: "End date YYYY-MM-DD"
        required: true
      source:
        description: "Source: 1c, docsales, or all"
        required: true
        default: "1c"
  schedule:
    # Business users are in UTC+5. We want the scheduled sync to fire just
    # after their local business day ends, at ~00:15 local time.
    # 00:15 local (UTC+5) == 19:15 UTC the previous calendar day.
    # Example: 2026-06-09 19:15 UTC == 2026-06-10 00:15 +05.
    - cron: "15 19 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute scheduled period
        id: period
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ inputs.end }}" >> "$GITHUB_OUTPUT"
            echo "source=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
          else
            # Scheduled run. The cron fires at 19:15 UTC, which is 00:15 the
            # following day in our business timezone UTC+5. We want to sync the
            # local calendar day that just ended, i.e. the previous local day.
            #
            # Local "now" = UTC now + 5 hours. The day we want is one day before
            # that local date.
            #   Example: cron at 2026-06-09 19:15 UTC
            #     -> local now = 2026-06-10 00:15 (+05)
            #     -> previous local day = 2026-06-09
            #     -> start = end = 2026-06-09
            local_day=$(date -u -d '+5 hours -1 day' +%F)
            echo "start=$local_day" >> "$GITHUB_OUTPUT"
            echo "end=$local_day" >> "$GITHUB_OUTPUT"
            echo "source=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Check sync script
        run: npm run check

      - name: Run sync
        env:
          ONEC_ODATA_URL: ${{ secrets.ONEC_ODATA_URL }}
          ONEC_BASIC_USER: ${{ secrets.ONEC_BASIC_USER }}
          ONEC_BASIC_PASSWORD: ${{ secrets.ONEC_BASIC_PASSWORD }}
          DOCSALES_SUPABASE_URL: ${{ secrets.DOCSALES_SUPABASE_URL }}
          DOCSALES_SERVICE_ROLE_KEY: ${{ secrets.DOCSALES_SERVICE_ROLE_KEY }}
          CRM_SUPABASE_URL: ${{ secrets.CRM_SUPABASE_URL }}
          CRM_SERVICE_ROLE_KEY: ${{ secrets.CRM_SERVICE_ROLE_KEY }}
        run: |
          node scripts/sync-sales.js \
            --start="${{ steps.period.outputs.start }}" \
            --end="${{ steps.period.outputs.end }}" \
            --source="${{ steps.period.outputs.source }}"
